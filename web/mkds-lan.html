<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NDS LAN</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #101316;
            --panel: #1b2025;
            --line: #303842;
            --text: #edf2f7;
            --muted: #9aa7b3;
            --accent: #35c2ff;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow: hidden;
        }

        .shell {
            display: grid;
            grid-template-rows: auto 1fr;
            gap: 10px;
            height: 100%;
            padding: 10px;
        }

        .bar {
            align-items: center;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            display: grid;
            gap: 10px;
            grid-template-columns: auto minmax(120px, 1fr) minmax(180px, 240px) auto auto auto auto;
            min-height: 48px;
            padding: 8px 10px;
        }

        h1 {
            font-size: 16px;
            font-weight: 700;
            margin: 0;
            white-space: nowrap;
        }

        label {
            align-items: center;
            color: var(--muted);
            display: flex;
            gap: 8px;
            min-width: 0;
        }

        input {
            background: #0d1115;
            border: 1px solid var(--line);
            border-radius: 4px;
            color: var(--text);
            font: inherit;
            min-width: 0;
            padding: 7px 8px;
            width: 100%;
        }

        select {
            background: #0d1115;
            border: 1px solid var(--line);
            border-radius: 4px;
            color: var(--text);
            font: inherit;
            max-width: 100%;
            min-height: 34px;
            padding: 6px 8px;
        }

        button {
            background: var(--accent);
            border: 0;
            border-radius: 4px;
            color: #061017;
            cursor: pointer;
            font: 700 13px/1 system-ui, sans-serif;
            min-height: 34px;
            padding: 0 12px;
        }

        .grid {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            min-height: 0;
        }

        .grid[data-count="1"] {
            grid-template-columns: minmax(0, 1fr);
        }

        .player {
            background: #000;
            border: 0;
            border-radius: 0;
            display: block;
            min-height: 0;
            overflow: hidden;
        }

        iframe {
            border: 0;
            height: 100%;
            min-height: 0;
            width: 100%;
        }

        @media (max-width: 980px) {
            .shell {
                overflow: auto;
            }

            body {
                overflow: auto;
            }

            .bar {
                grid-template-columns: 1fr;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .player {
                min-height: 640px;
            }
        }
    </style>
</head>
<body>
<main class="shell">
    <header class="bar">
        <h1>NDS LAN</h1>
        <label>
            Room
            <input id="room" value="mkds-demo" spellcheck="false">
        </label>
        <label>
            Game
            <select id="game">
                <option value="Mario-Kart-DS-USA">Mario Kart DS</option>
                <option value="Tetris-DS-(USA)">Tetris DS</option>
                <option value="blocksds-local-multiplayer">blocksds local multiplayer</option>
            </select>
        </label>
        <label>
            Players
            <select id="players">
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
        </label>
        <button id="start" type="button">Start</button>
        <button id="reload" type="button">Reload</button>
        <button id="open" type="button">Open P2</button>
    </header>
    <section class="grid" id="grid"></section>
</main>
<script>
    const params = new URLSearchParams(location.search);
    const bootDelayMs = Math.max(0, Number.parseInt(params.get("bootDelayMs") || "700", 10) || 0);
    const closeDelayMs = Math.max(0, Number.parseInt(params.get("closeDelayMs") || "250", 10) || 0);
    const roomInput = document.getElementById("room");
    const gameSelect = document.getElementById("game");
    const playerSelect = document.getElementById("players");
    const grid = document.getElementById("grid");
    const slots = new Map();
    let launchSeq = 0;
    let launchId = "";

    if (params.get("room")) {
        roomInput.value = params.get("room");
    }
    if (params.get("game")) {
        const requestedGame = params.get("game");
        if (![...gameSelect.options].some((option) => option.value === requestedGame)) {
            const option = document.createElement("option");
            option.value = requestedGame;
            option.textContent = requestedGame;
            gameSelect.appendChild(option);
        }
        gameSelect.value = requestedGame;
    }

    const initialPlayers = Math.max(1, Math.min(4, Number.parseInt(params.get("players") || "2", 10) || 2));
    playerSelect.value = String(initialPlayers);

    function frameUrl(slot) {
        const game = gameSelect.value;
        const room = `${roomInput.value}-${launchId}-p${slot}___${game}`;
        const url = new URL("/", location.href);
        url.searchParams.set("id", room);
        url.searchParams.set("player", "1");
        url.searchParams.set("zone", params.get(`zone${slot}`) || `mkds-p${slot}`);
        url.searchParams.set("client", "v7");
        url.searchParams.set("view", "stream");
        const wid = params.get(`wid${slot}`);
        if (wid) {
            url.searchParams.set("wid", wid);
        }
        return url.pathname + url.search;
    }

    function playerCount() {
        return Math.max(1, Math.min(4, Number.parseInt(playerSelect.value, 10) || 2));
    }

    function updatePageUrl(count = playerCount()) {
        const pageUrl = new URL(location.href);
        pageUrl.searchParams.set("room", roomInput.value);
        pageUrl.searchParams.set("players", String(count));
        pageUrl.searchParams.set("game", gameSelect.value);
        history.replaceState(null, "", pageUrl);
    }

    function renderSlots() {
        const count = playerCount();
        ensureSlots(count);
        updatePageUrl(count);
    }

    function nextLaunchId() {
        launchSeq += 1;
        return `${Date.now().toString(36)}-${launchSeq.toString(36)}`;
    }

    function closeFrame(frame, reason) {
        if (!frame || frame.src === "about:blank") {
            return 0;
        }

        try {
            if (typeof frame.contentWindow?.__cloudGameCleanup === "function") {
                if (frame.contentWindow.__cloudGameCleanup(reason)) {
                    return closeDelayMs;
                }
            }
        } catch (error) {
            console.debug("frame cleanup skipped", error);
        }

        return 0;
    }

    function closeSlot(slot, reason) {
        return closeFrame(document.getElementById(`p${slot}`), reason);
    }

    function closeAllFrames(reason) {
        for (const slot of slots.keys()) {
            closeSlot(slot, reason);
        }
    }

    function ensureSlots(count) {
        grid.dataset.count = String(count);
        for (const [slot, article] of slots) {
            if (slot > count) {
                const delay = closeSlot(slot, "mkds-lan-remove");
                window.setTimeout(() => article.remove(), delay);
                slots.delete(slot);
            }
        }
        for (let slot = 1; slot <= count; slot++) {
            if (slots.has(slot)) continue;
            const article = document.createElement("article");
            article.className = "player";
            article.innerHTML = `
                <iframe id="p${slot}" title="Player ${slot}" allow="autoplay; fullscreen; gamepad"></iframe>
            `;
            grid.appendChild(article);
            slots.set(slot, article);
        }
    }

    function loadFrames() {
        const count = playerCount();
        launchId = nextLaunchId();
        ensureSlots(count);
        for (let slot = 1; slot <= count; slot++) {
            const src = frameUrl(slot);
            const frame = document.getElementById(`p${slot}`);
            const reloadSeq = Number.parseInt(frame.dataset.reloadSeq || "0", 10) + 1;
            const closeDelay = closeFrame(frame, "mkds-lan-reload");
            frame.dataset.reloadSeq = String(reloadSeq);
            setTimeout(() => {
                if (frame.dataset.reloadSeq !== String(reloadSeq)) return;
                frame.src = "about:blank";
            }, closeDelay);
            setTimeout(() => {
                if (frame.dataset.reloadSeq !== String(reloadSeq)) return;
                frame.src = src;
            }, closeDelay + (slot - 1) * bootDelayMs);
        }
        updatePageUrl(count);
    }

    document.getElementById("start").addEventListener("click", loadFrames);
    document.getElementById("reload").addEventListener("click", loadFrames);
    document.getElementById("open").addEventListener("click", () => {
        if (!launchId) {
            launchId = nextLaunchId();
        }
        window.open(frameUrl(2), "_blank", "noopener");
    });
    playerSelect.addEventListener("change", renderSlots);
    gameSelect.addEventListener("change", renderSlots);
    window.addEventListener("pagehide", () => closeAllFrames("mkds-lan-pagehide"));
    window.addEventListener("beforeunload", () => closeAllFrames("mkds-lan-beforeunload"));
    roomInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") {
            renderSlots();
        }
    });
    renderSlots();
</script>
</body>
</html>
