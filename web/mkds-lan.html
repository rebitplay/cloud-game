<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NDS Room API</title>
    <style>
        :root {
            color-scheme: dark;
            --bg: #111314;
            --panel: #1b1f20;
            --panel-2: #151819;
            --line: #343a3d;
            --text: #eef1f0;
            --muted: #9aa3a0;
            --accent: #40d39a;
            --accent-2: #68a8ff;
            --danger: #ff6b6b;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            min-height: 100%;
            margin: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .shell {
            display: grid;
            gap: 10px;
            min-height: 100vh;
            padding: 10px;
        }

        .bar,
        .players,
        .result {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
        }

        .bar {
            display: grid;
            gap: 10px;
            grid-template-columns: auto minmax(160px, 1fr) minmax(260px, 2fr) minmax(260px, 1.5fr) minmax(110px, 140px) auto;
            padding: 10px;
        }

        h1 {
            align-self: center;
            font-size: 16px;
            margin: 0;
            white-space: nowrap;
        }

        label {
            color: var(--muted);
            display: grid;
            gap: 5px;
            min-width: 0;
        }

        input,
        select {
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 4px;
            color: var(--text);
            font: inherit;
            min-height: 34px;
            min-width: 0;
            padding: 7px 8px;
            width: 100%;
        }

        button {
            align-self: end;
            background: var(--accent);
            border: 0;
            border-radius: 4px;
            color: #07120d;
            cursor: pointer;
            font: 700 13px/1 system-ui, sans-serif;
            min-height: 34px;
            padding: 0 14px;
            white-space: nowrap;
        }

        button:disabled {
            cursor: wait;
            opacity: .7;
        }

        .players {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            padding: 10px;
        }

        .result {
            display: grid;
            gap: 10px;
            min-height: 0;
            padding: 10px;
        }

        .status {
            color: var(--muted);
            min-height: 20px;
        }

        .status[data-kind="error"] {
            color: var(--danger);
        }

        .links {
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .link {
            background: var(--panel-2);
            border: 1px solid var(--line);
            border-radius: 6px;
            display: grid;
            gap: 6px;
            min-width: 0;
            padding: 8px;
        }

        .link strong {
            font-size: 13px;
        }

        .link a {
            color: var(--accent-2);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .grid {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            min-height: 0;
        }

        .grid[data-count="1"] {
            grid-template-columns: minmax(0, 1fr);
        }

        .player {
            background: #000;
            min-height: 520px;
            overflow: hidden;
        }

        iframe {
            border: 0;
            display: block;
            height: 100%;
            width: 100%;
        }

        @media (max-width: 1100px) {
            .bar,
            .players,
            .links,
            .grid {
                grid-template-columns: 1fr;
            }

            .player {
                min-height: 640px;
            }
        }
    </style>
</head>
<body>
<main class="shell">
    <form class="bar" id="form">
        <h1>NDS Room API</h1>
        <label>
            Room
            <input id="room" value="tetris-demo" spellcheck="false">
        </label>
        <label>
            ROM URL
            <input id="romUrl" spellcheck="false">
        </label>
        <label>
            ROM SHA-1
            <input id="romSha1" spellcheck="false">
        </label>
        <label>
            Players
            <select id="players">
                <option value="2">2</option>
                <option value="3">3</option>
                <option value="4">4</option>
            </select>
        </label>
        <button id="create" type="submit">Create</button>
    </form>
    <section class="players" id="saveInputs"></section>
    <section class="result">
        <div class="status" id="status"></div>
        <div class="links" id="links"></div>
        <div class="grid" id="grid"></div>
    </section>
</main>
<script>
    const params = new URLSearchParams(location.search);
    const form = document.getElementById("form");
    const roomInput = document.getElementById("room");
    const romInput = document.getElementById("romUrl");
    const romSha1Input = document.getElementById("romSha1");
    const playerSelect = document.getElementById("players");
    const saveInputs = document.getElementById("saveInputs");
    const createButton = document.getElementById("create");
    const statusEl = document.getElementById("status");
    const linksEl = document.getElementById("links");
    const grid = document.getElementById("grid");

    roomInput.value = params.get("room") || roomInput.value;
    romInput.value = params.get("rom") || "builtin:Tetris-DS-(USA).nds";
    const builtinRomHashes = {
        "builtin:Tetris-DS-(USA).nds": "13eb2e7e5357a6e31f94ea238826c111c965bc9b",
    };
    romSha1Input.value = params.get("sha1") || params.get("rom_sha1") || builtinRomHashes[romInput.value] || "";
    playerSelect.value = String(Math.max(2, Math.min(4, Number.parseInt(params.get("players") || "3", 10) || 3)));

    function playerCount() {
        return Math.max(2, Math.min(4, Number.parseInt(playerSelect.value, 10) || 2));
    }

    function renderSaveInputs() {
        const count = playerCount();
        saveInputs.replaceChildren();
        for (let player = 1; player <= count; player++) {
            const label = document.createElement("label");
            label.textContent = `P${player} save URL`;
            const input = document.createElement("input");
            input.id = `save${player}`;
            input.spellcheck = false;
            input.value = params.get(`save${player}`) || "";
            label.appendChild(input);
            saveInputs.appendChild(label);
        }
    }

    function setStatus(text, kind = "") {
        statusEl.textContent = text;
        statusEl.dataset.kind = kind;
    }

    function requestPayload() {
        const saves = [];
        for (let player = 1; player <= playerCount(); player++) {
            const value = document.getElementById(`save${player}`)?.value.trim();
            if (value) saves.push({ player, srm_url: value });
        }
        return {
            base_url: location.origin,
            players: playerCount(),
            room: roomInput.value.trim(),
            rom_sha1: romSha1Input.value.trim(),
            rom_url: romInput.value.trim(),
            saves,
        };
    }

    async function createRoom() {
        createButton.disabled = true;
        linksEl.replaceChildren();
        grid.replaceChildren();
        setStatus("Creating...");
        try {
            const response = await fetch("/api/nds/rooms", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(requestPayload()),
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || `HTTP ${response.status}`);
            }
            renderSession(data);
            updatePageUrl();
            setStatus(`${data.room} / ${data.game}`);
        } catch (error) {
            setStatus(error.message, "error");
        } finally {
            createButton.disabled = false;
        }
    }

    function renderSession(session) {
        linksEl.replaceChildren();
        grid.replaceChildren();
        grid.dataset.count = String(session.players.length);
        for (const player of session.players) {
            const link = document.createElement("div");
            link.className = "link";
            const title = document.createElement("strong");
            title.textContent = `Player ${player.player}`;
            const anchor = document.createElement("a");
            anchor.href = player.url;
            anchor.target = "_blank";
            anchor.rel = "noopener";
            anchor.textContent = player.url;
            link.append(title, anchor);
            linksEl.appendChild(link);

            const article = document.createElement("article");
            article.className = "player";
            const frame = document.createElement("iframe");
            frame.title = `Player ${player.player}`;
            frame.allow = "autoplay; fullscreen; gamepad";
            frame.src = player.url;
            article.appendChild(frame);
            grid.appendChild(article);
        }
    }

    function updatePageUrl() {
        const url = new URL(location.href);
        url.searchParams.set("room", roomInput.value.trim());
        url.searchParams.set("rom", romInput.value.trim());
        url.searchParams.set("sha1", romSha1Input.value.trim());
        url.searchParams.set("players", String(playerCount()));
        for (let player = 1; player <= 4; player++) {
            const input = document.getElementById(`save${player}`);
            if (input?.value.trim()) {
                url.searchParams.set(`save${player}`, input.value.trim());
            } else {
                url.searchParams.delete(`save${player}`);
            }
        }
        history.replaceState(null, "", url);
    }

    form.addEventListener("submit", (event) => {
        event.preventDefault();
        createRoom();
    });
    playerSelect.addEventListener("change", renderSaveInputs);
    romInput.addEventListener("change", () => {
        const hash = builtinRomHashes[romInput.value.trim()];
        if (hash && !romSha1Input.value.trim()) {
            romSha1Input.value = hash;
        }
    });
    renderSaveInputs();
</script>
</body>
</html>
