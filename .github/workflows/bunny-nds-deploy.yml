name: deploy-bunny-nds

on:
  push:
    branches:
      - rebit
  workflow_dispatch:

concurrency:
  group: bunny-nds-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: rebitplay/cloud-game
  BUNNY_APP_ID: 71qZ2gP10g3NCih
  BUNNY_CONTAINER_NAME: Container-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME || github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build tag
        id: tag
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::8}"
          image_tag="bunny-rebit-${short_sha}-${GITHUB_RUN_NUMBER}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${short_sha}-rebit-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build Bunny image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: bunny-magic
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}

      - name: Push Bunny image
        shell: bash
        run: docker push ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}

      - name: Update Bunny container image
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ env.BUNNY_APP_ID }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: ${{ env.BUNNY_CONTAINER_NAME }}
          image_tag: ${{ steps.tag.outputs.image_tag }}
