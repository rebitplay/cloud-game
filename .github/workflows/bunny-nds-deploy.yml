name: deploy-bunny-nds

on:
  push:
    branches:
      - rebit
  workflow_dispatch:

concurrency:
  group: bunny-nds-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: rebitplay/cloud-game
  BUNNY_CONTAINER_NAME: Container-1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: bangnokia
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build tag
        id: tag
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::8}"
          image_tag="bunny-rebit-${short_sha}-${GITHUB_RUN_NUMBER}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${short_sha}-rebit-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build Bunny image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: bunny-magic
          platforms: linux/amd64
          load: true
          provenance: false
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}

      - name: Push Bunny image
        shell: bash
        run: docker push ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - region: sg
            app_id: 71qZ2gP10g3NCih
            endpoint: https://mc-3zy4wczxqt.b-cdn.net
          - region: na
            app_id: 9ZlpOR80rjKBvzc
            endpoint: https://mc-sdr0hg00iu.bunny.run
          - region: eu
            app_id: BNROgZ6bLqqZuzr
            endpoint: https://mc-5jsc2z7gtg.bunny.run
          - region: sa
            app_id: 8yHsPf4mHEwMGhB
            endpoint: https://mc-s8ih8h5x0o.bunny.run

    steps:
      - uses: actions/checkout@v4

      - name: Update Bunny ${{ matrix.region }} container image
        uses: BunnyWay/actions/container-update-image@main
        with:
          app_id: ${{ matrix.app_id }}
          api_key: ${{ secrets.BUNNYNET_API_KEY }}
          container: ${{ env.BUNNY_CONTAINER_NAME }}
          image_tag: ${{ needs.build.outputs.image_tag }}

      - name: Verify Bunny ${{ matrix.region }} public endpoint
        shell: bash
        env:
          NDS_ENDPOINT: ${{ matrix.endpoint }}
          NDS_PUBLIC_PREFLIGHT_ONLY: "true"
        run: |
          for attempt in {1..30}; do
            if node scripts/verify-bunny-nds.mjs; then
              exit 0
            fi
            sleep 10
          done
          exit 1
