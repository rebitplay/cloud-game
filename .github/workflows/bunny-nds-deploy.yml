name: deploy-bunny-nds

on:
  push:
    branches:
      - rebit
  workflow_dispatch:

concurrency:
  group: bunny-nds-deploy
  cancel-in-progress: true

env:
  IMAGE_NAME: rebitplay/cloud-game
  BUNNY_APP_ID: 71qZ2gP10g3NCih
  BUNNY_CONTAINER_ID: 71qZ2gP10g3NCih-1sNE

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tag
        id: tag
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::8}"
          image_tag="bunny-rebit-${short_sha}-${GITHUB_RUN_NUMBER}"
          echo "image_tag=${image_tag}" >> "$GITHUB_OUTPUT"
          echo "version=${short_sha}-rebit-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Build and push Bunny image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: bunny-magic
          push: true
          tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.image_tag }}
          build-args: |
            VERSION=${{ steps.tag.outputs.version }}

      - name: Update Bunny container image
        shell: bash
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
          IMAGE_TAG: ${{ steps.tag.outputs.image_tag }}
        run: |
          test -n "$BUNNY_API_KEY"
          curl --fail --show-error --silent --request PATCH \
            "https://api.bunny.net/mc/apps/${BUNNY_APP_ID}/containers/${BUNNY_CONTAINER_ID}" \
            --header "AccessKey: ${BUNNY_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "{\"imageTag\":\"${IMAGE_TAG}\"}"

      - name: Deploy Bunny application
        shell: bash
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNYNET_API_KEY }}
        run: |
          curl --fail --show-error --silent --request POST \
            "https://api.bunny.net/mc/apps/${BUNNY_APP_ID}/deploy" \
            --header "AccessKey: ${BUNNY_API_KEY}"
